</style></head><body><main><header><div><div class="eyebrow">CCD STUDIO · BUSINESS LEDGER</div><h1>把生意，记明白。</h1></div><button id="backupTop">备份</button></header><div class="row toolbar"><span id="pageTitle">经营概览</span><input id="month" type="month" aria-label="报表月份"></div><div id="page"></div><p class="hint">单人本机账本 · 金额单位：元 · 每周记得导出备份</p></main><nav class="footnav" aria-label="主导航"><div class="inner"><button data-page="home" class="active">概览</button><button data-page="orders">订单</button><button data-page="flow">流水</button><button data-page="gear">相机</button><button data-page="reports">报表</button></div></nav><div id="toast" role="status" aria-live="polite" class="hidden"></div><dialog id="modal"><div class="content"><div class="row"><h2 id="dialogTitle"></h2><button id="closeModal" aria-label="关闭">关闭</button></div><div id="dialogBody"></div></div></dialog><input id="restoreFile" type="file" accept=".json,application/json" hidden><script>
'use strict';
const KEY='ccd-business-v2',OLD='pocket-ledger-v1',BK='ccd-backup-time';
const $=id=>document.getElementById(id),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>crypto.randomUUID(),money=n=>(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const names={payment:'服务收款',refund:'服务退款',deposit:'收取押金',depositRefund:'退还押金',expense:'经营支出',otherIncome:'其他收入',legacyIncome:'原账本收入',legacyExpense:'原账本支出'},expenseCats=['设备购置','维修保养','交通出行','场地道具','营销推广','耗材配件','其他支出'];
let state={version:2,cameras:[],orders:[],transactions:[]},page='home',filter='all',search='',ready=true,toastTimer;
const activeTx=(s=state)=>s.transactions.filter(t=>!t.voided),sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0),amountOk=n=>Number.isSafeInteger(n)&&n>=0&&n<=99999999999,short=(v,max=200)=>typeof v==='string'&&v.length<=max;
function orderTotals(o,s=state){const a=activeTx(s).filter(t=>t.orderId===o.id);return {paid:sum(a,t=>t.kind==='payment'?t.cents:t.kind==='refund'?-t.cents:0),held:sum(a,t=>t.kind==='deposit'?t.cents:t.kind==='depositRefund'?-t.cents:0)}}
function cash(t){return ['refund','depositRefund','expense','legacyExpense'].includes(t.kind)?-t.cents:t.cents}
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d}
function validate(s){if(!s||s.version!==2||!['cameras','orders','transactions'].every(k=>Array.isArray(s[k])&&s[k].length<=100000))throw Error('备份格式不正确。');for(const key of ['cameras','orders','transactions']){const ids=new Set();for(const x of s[key]){if(!x||!short(x.id,150)||!x.id||ids.has(x.id))throw Error('记录编号无效或重复。');ids.add(x.id)}}
for(const c of s.cameras)if(!short(c.name,80)||!c.name||!short(c.serial,80)||!['active','maintenance','retired'].includes(c.status))throw Error('相机记录无效。');
for(const o of s.orders)if(!['rental','shoot'].includes(o.type)||!['booked','ongoing','done','cancelled'].includes(o.status)||!short(o.customer,80)||!o.customer||!short(o.contact,100)||!short(o.note)||!validDate(o.start)||!validDate(o.end)||o.end<o.start||!amountOk(o.price)||!amountOk(o.depositTarget)||!(o.cameraId===null||s.cameras.some(c=>c.id===o.cameraId))||(o.type==='rental'&&!o.cameraId)||(o.type==='shoot'&&o.depositTarget!==0))throw Error('订单记录无效。');
for(const t of s.transactions){if(!Object.hasOwn(names,t.kind)||!amountOk(t.cents)||!t.cents||!validDate(t.date)||!short(t.note)||!short(t.category,80)||typeof t.voided!=='boolean'||!(t.orderId===null||s.orders.some(o=>o.id===t.orderId)))throw Error('流水记录无效。');if(['payment','refund','deposit','depositRefund'].includes(t.kind)&&!t.orderId)throw Error('订单收退款必须关联订单。');if(['deposit','depositRefund'].includes(t.kind)&&s.orders.find(o=>o.id===t.orderId)?.type!=='rental')throw Error('押金必须关联出租订单。')}
for(const o of s.orders){const b=orderTotals(o,s);if(b.paid<0||b.paid>o.price||b.held<0||b.held>o.depositTarget)throw Error('金额超出限制：服务净收款应在 0 与订单金额之间，押金余额应在 0 与应收押金之间。');if(o.status==='cancelled'&&(b.paid||b.held))throw Error('取消前请先退清服务款和押金。');if(cameraConflict(o,s))throw Error('同一相机存在重复预约档期。')}
return s}
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),5500)}
function save(next){if(!ready)throw Error('本地数据无法读取，已停止写入。请先导出原始数据。');validate(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;render()}
function mutate(fn){const next=JSON.parse(JSON.stringify(state));fn(next);save(next)}
function migrateOld(){const old=JSON.parse(localStorage.getItem(OLD)||'[]');if(!Array.isArray(old))throw Error('原账本格式异常。');for(const t of old){if(!t||!['income','expense'].includes(t.type)||!amountOk(t.cents)||!t.cents||!validDate(t.date)||!short(t.note)||!short(t.category,80)||!short(t.id,100))throw Error('原账本存在异常记录。');state.transactions.push({id:'legacy-'+t.id,orderId:null,kind:t.type==='income'?'legacyIncome':'legacyExpense',cents:t.cents,date:t.date,category:t.category,note:t.note,voided:false})}validate(state)}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));else{migrateOld();localStorage.setItem(KEY,JSON.stringify(state))}}catch(e){ready=false;setTimeout(()=>notify('本地数据读取失败：'+e.message),100)}
function E(tag,text='',cls=''){const e=document.createElement(tag);if(text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function button(text,fn,cls=''){const e=E('button',text,cls);e.type='button';e.onclick=fn;return e}
function block(title){const e=E('section',null,'card');if(title)e.append(E('h2',title));return e}
function empty(parent,text){parent.append(E('div',text,'empty'))}
function row(a,b){const e=E('div',null,'row');if(a)e.append(a);if(b)e.append(b);return e}
function metric(label,value){const e=E('div',null,'metric');e.append(E('span',label,'muted'),E('strong',value));return e}
function monthTx(){return activeTx().filter(t=>t.date.startsWith($('month').value))}
function stats(a){const income=sum(a,t=>['payment','otherIncome','legacyIncome'].includes(t.kind)?t.cents:t.kind==='refund'?-t.cents:0),expense=sum(a,t=>['expense','legacyExpense'].includes(t.kind)?t.cents:0),dep=sum(a,t=>t.kind==='deposit'?t.cents:t.kind==='depositRefund'?-t.cents:0);return {income,expense,dep,net:income-expense,cash:income-expense+dep}}
function liabilities(){return sum(state.orders,o=>orderTotals(o).held)}
function due(o){return o.status==='cancelled'?0:o.price-orderTotals(o).paid}
function cameraName(id){return state.cameras.find(c=>c.id===id)?.name||'未指定相机'}
function orderLabel(o){return (o.type==='rental'?'出租':'陪拍')+' · '+o.customer}
function statusLabel(o){return ({booked:'待服务',ongoing:o.type==='rental'?'出租中':'服务中',done:o.type==='rental'?'已归还':'已完成',cancelled:'已取消'})[o.status]}
function show(nextPage){page=nextPage;filter='all';search='';render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('pageTitle').textContent=({home:'经营概览',orders:'订单管理 · 全部日期',flow:'资金流水',gear:'相机与档期',reports:'经营报表'})[page];$('month').classList.toggle('hidden',['orders','gear'].includes(page));const p=$('page');p.replaceChildren();if(!ready)p.append(E('div','本地数据读取异常，已暂停所有写入。请先导出原始数据。','notice'));({home:homeView,orders:ordersView,flow:flowView,gear:gearView,reports:reportView})[page](p)}
function homeView(p){const s=stats(monthTx()),hero=E('section',null,'hero');hero.append(E('div','本月实收服务款与其他收入','muted'),E('div','¥'+money(s.income),'big'));const m=E('div',null,'metrics');for(const [k,v] of [['经营支出',s.expense],['收支结余',s.net],['资金净流入',s.cash]]){const d=E('div');d.append(E('span',k,'muted'),E('strong','¥'+money(v)));m.append(d)}hero.append(m);p.append(hero);const g=E('div',null,'grid');g.append(metric('全部订单待收款','¥'+money(sum(state.orders,due))),metric('在手押金 · 待归还','¥'+money(liabilities())));p.append(g);const a=E('div',null,'toolbar');a.append(button('+ 新建出租',()=>orderForm(null,'rental'),'primary'),button('+ 新建陪拍',()=>orderForm(null,'shoot'),'primary'),button('记支出',()=>transactionForm(null,'expense')));p.append(a);const pending=block('接下来要处理'),tasks=state.orders.filter(o=>o.status!=='cancelled'&&(o.status!=='done'||due(o)>0||orderTotals(o).held>0)).sort((a,b)=>a.end.localeCompare(b.end));if(!tasks.length)empty(pending,'今天还没有待办。\n从一笔出租或陪拍订单开始。');for(const o of tasks.slice(0,6))pending.append(orderCard(o));p.append(pending,E('p','收支结余 = 实收服务款（扣退款）+ 其他收入 − 经营支出，非会计净利润。押金不计入收入；设备购置按实际付款计支出。','hint'))}
function ordersView(p){const tools=E('div',null,'toolbar'),q=E('input');q.type='search';q.placeholder='搜索客户、联系方式、备注';q.value=search;q.oninput=()=>{search=q.value;draw()};const select=E('select');select.setAttribute('aria-label','订单筛选');for(const [v,n] of [['all','全部订单'],['rental','相机出租'],['shoot','陪拍服务'],['unpaid','待收款'],['deposit','待退押金'],['overdue','逾期未归还']])select.append(new Option(n,v));select.value=filter;select.onchange=()=>{filter=select.value;draw()};tools.append(q,select,button('+ 订单',()=>orderForm(),'primary'));p.append(tools);const list=E('div');p.append(list);function draw(){list.replaceChildren();const a=state.orders.filter(o=>{const b=orderTotals(o);return (filter==='all'||filter===o.type||filter==='unpaid'&&due(o)>0||filter==='deposit'&&b.held>0||filter==='overdue'&&o.type==='rental'&&!['done','cancelled'].includes(o.status)&&o.end<today())&&[o.customer,o.contact,o.note].join(' ').toLowerCase().includes(search.toLowerCase())}).sort((a,b)=>b.start.localeCompare(a.start));if(!a.length)empty(list,'没有符合条件的订单。');a.forEach(o=>list.append(orderCard(o)))}draw()}
function orderCard(o){const e=E('article',null,'order'),b=orderTotals(o),overdue=o.type==='rental'&&!['done','cancelled'].includes(o.status)&&o.end<today();e.append(row(E('h3',orderLabel(o),'textwrap'),E('span',overdue?'逾期未归还':statusLabel(o),'pill '+(overdue?'gold':''))),E('p',`${o.start} → ${o.end}${o.cameraId?' · '+cameraName(o.cameraId):''}`,'muted'));if(o.note)e.append(E('p',o.note,'muted'));const amounts=E('div',null,'moneyrow');for(const [l,n] of [['订单金额',o.price],['已收服务款',b.paid],['待收款',due(o)]]){const d=E('div',l,'muted');d.append(E('strong','¥'+money(n)));amounts.append(d)}e.append(amounts);if(o.type==='rental')e.append(E('div',`押金：应收 ¥${money(o.depositTarget)} / 在手 ¥${money(b.held)}${o.status==='done'&&b.held?' · 待退还':''}`,'muted'));const a=E('div',null,'actions');a.append(button('详情 / 管理',()=>detail(o.id),'small'));if(o.status!=='cancelled'&&due(o)>0)a.append(button('收款',()=>transactionForm(o.id,'payment'),'primary small'));if(o.type==='rental'&&b.held>0)a.append(button('退押金',()=>transactionForm(o.id,'depositRefund'),'small'));e.append(a);return e}
function flowView(p){const tools=E('div',null,'toolbar');tools.append(button('+ 经营支出',()=>transactionForm(null,'expense'),'primary'),button('+ 其他收入',()=>transactionForm(null,'otherIncome')),button('订单收款',()=>{show('orders');notify('请在对应订单点击“收款”，支持分次登记定金和尾款。')}));p.append(tools);const s=stats(monthTx());p.append(E('p',`本月资金净流入 ¥${money(s.cash)}，其中押金净收退 ¥${money(s.dep)}。押金收退不影响收入。`,'hint'));const c=block('本月资金明细'),a=state.transactions.filter(t=>t.date.startsWith($('month').value)).slice().reverse().sort((a,b)=>b.date.localeCompare(a.date));if(!a.length)empty(c,'本月暂无流水。');a.forEach(t=>c.append(txCard(t)));p.append(c)}
function txCard(t){const e=E('div',null,'tx'),o=state.orders.find(o=>o.id===t.orderId),l=E('div',null,'textwrap');l.append(E('h3',(t.voided?'[已作废] ':'')+names[t.kind]),E('p',t.date+(o?' · '+orderLabel(o):'')+' · '+t.category,'muted'));if(t.note)l.append(E('p',t.note,'muted'));const r=E('div');r.append(E('strong',(cash(t)<0?'−':'+')+'¥'+money(t.cents),cash(t)<0?'expense':'income'));if(!t.voided)r.append(button('作废',()=>voidTransaction(t.id),'small'));e.append(row(l,r));return e}
function gearView(p){p.append(button('+ 添加相机',()=>cameraForm(),'primary'));if(!state.cameras.length)empty(p,'先添加相机，再创建出租订单。\n同一台相机的未完成订单会检查日期冲突。');for(const c of state.cameras){const e=block(),a=state.orders.filter(o=>o.cameraId===c.id&&!['done','cancelled'].includes(o.status)).sort((a,b)=>a.start.localeCompare(b.start));e.append(row(E('h3',c.name),E('span',({active:'可接单',maintenance:'维修中',retired:'已停用'})[c.status],'pill')),E('p',c.serial?'编号 / 序列号：'+c.serial:'尚未填写编号','muted'));if(!a.length)e.append(E('p','暂无待完成的预约','muted'));a.forEach(o=>e.append(button(`${o.start} → ${o.end} · ${o.customer} · ${statusLabel(o)}`,()=>detail(o.id),'small')));const ac=E('div',null,'actions');ac.append(button('编辑相机',()=>cameraForm(c.id),'small'));e.append(ac);p.append(e)}p.append(E('p','档期按整天计算，起止日期均包含。同日归还再出租需手动协调；逾期未归还会在订单待办提示。','hint'))}
function reportView(p){const a=monthTx(),s=stats(a),g=E('div',null,'grid');g.append(metric('实收收入（扣退款）','¥'+money(s.income)),metric('实际经营支出','¥'+money(s.expense)),metric('收支结余','¥'+money(s.net)),metric('资金净流入（含押金）','¥'+money(s.cash)));p.append(g);const services=block('收入来自哪里');for(const [type,title] of [['rental','相机出租'],['shoot','陪拍服务'],['other','其他 / 原账本']]){const n=sum(a,t=>{const o=state.orders.find(o=>o.id===t.orderId);if(type==='other')return ['otherIncome','legacyIncome'].includes(t.kind)?t.cents:0;return o?.type===type?(t.kind==='payment'?t.cents:t.kind==='refund'?-t.cents:0):0});services.append(row(E('span',title),E('strong','¥'+money(n))));const bar=E('div',null,'bar'),i=E('i');i.style.width=Math.min(100,Math.max(0,n/Math.max(s.income,1)*100))+'%';bar.append(i);services.append(bar)}p.append(services);const costs=block('支出分类'),byCat={};for(const t of a.filter(t=>['expense','legacyExpense'].includes(t.kind)))byCat[t.category]=(byCat[t.category]||0)+t.cents;if(!Object.keys(byCat).length)empty(costs,'本月暂无支出。');for(const [k,v]of Object.entries(byCat).sort((a,b)=>b[1]-a[1]))costs.append(row(E('p',k,'muted'),E('strong','¥'+money(v))));p.append(costs);const os=state.orders.filter(o=>o.start.startsWith($('month').value)&&o.status!=='cancelled'),c=block('本月服务订单');c.append(E('p',`按服务开始日期统计：${os.length} 单，订单金额 ¥${money(sum(os,o=>o.price))}，当前待收 ¥${money(sum(os,due))}。`,'muted'),E('p',`全账本当前在手押金 ¥${money(liabilities())}。押金是待退资金，不是利润。`,'hint'));p.append(c);const history=block('近 6 个月收支'),table=E('table',null,'reporttable'),head=E('tr');['月份','实收收入','支出','结余'].forEach(x=>head.append(E('th',x)));table.append(head);const base=new Date($('month').value+'-01T12:00:00');for(let j=5;j>=0;j--){const d=new Date(base.getFullYear(),base.getMonth()-j,1),m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),s=stats(activeTx().filter(t=>t.date.startsWith(m))),r=E('tr');[m,money(s.income),money(s.expense),money(s.net)].forEach(x=>r.append(E('td',x)));table.append(r)}history.append(table);p.append(history,button('导出本月流水 CSV',exportCSV,'primary'),E('p','报表按流水实际收付日期统计；订单按服务开始日期统计。收支结余未计设备折旧、未付款成本与税费，不是会计净利润。作废流水不纳入报表。','hint'))}
function open(title,build){$('dialogTitle').textContent=title;$('dialogBody').replaceChildren();build($('dialogBody'));if(!$('modal').open)$('modal').showModal()}
function close(){$('modal').close()}
function field(f,title,id,type='text',value='',options){const label=E('label',title);label.htmlFor=id;const x=E(type==='select'?'select':type==='textarea'?'textarea':'input');x.id=id;if(!['select','textarea'].includes(type))x.type=type;if(options)for(const [v,n]of options)x.append(new Option(n,v));x.value=value;f.append(label,x);return x}
function formBox(parent,submit){const f=E('form'),err=E('div','','error');err.setAttribute('role','alert');f.append(err);f.onsubmit=e=>{e.preventDefault();try{submit();close();notify('已保存在当前设备。')}catch(e){err.textContent=e.message||'保存失败，请检查存储空间。'}};parent.append(f);return f}
function submitButton(f,text){const b=E('button',text,'primary full');b.type='submit';f.append(b)}
function cents(value,zero=false){const raw=value.trim();if(!/^\d{1,9}(\.\d{1,2})?$/.test(raw))throw Error('金额请输入数字，最多两位小数。');const [a,b='']=raw.split('.'),n=Number(a)*100+Number(b.padEnd(2,'0'));if(!amountOk(n)||(!zero&&!n))throw Error('金额必须大于 0。');return n}
function cameraConflict(o,s){return o.cameraId&&!['done','cancelled'].includes(o.status)&&s.orders.some(x=>x.id!==o.id&&x.cameraId===o.cameraId&&!['done','cancelled'].includes(x.status)&&x.start<=o.end&&x.end>=o.start)}
function orderForm(id=null,type='rental'){const prev=state.orders.find(o=>o.id===id);open(prev?'编辑订单':'新建业务订单',parent=>{const f=formBox(parent,()=>{const o={id:id||uid(),type:$('oType').value,customer:$('oCustomer').value.trim(),contact:$('oContact').value.trim(),start:$('oStart').value,end:$('oEnd').value,price:cents($('oPrice').value,true),depositTarget:$('oType').value==='rental'?cents($('oDeposit').value||'0',true):0,cameraId:$('oCamera').value||null,note:$('oNote').value.trim(),status:prev?.status||'booked'};if(!o.customer)throw Error('请填写客户称呼。');if(!validDate(o.start)||!validDate(o.end)||o.end<o.start)throw Error('请检查日期，结束日期不能早于开始日期。');if(o.type==='rental'&&!o.cameraId)throw Error('出租订单需要选择相机，请先在“相机”中添加。');if(o.cameraId&&state.cameras.find(c=>c.id===o.cameraId).status!=='active'&&prev?.cameraId!==o.cameraId)throw Error('该相机正在维修或已停用。');if(cameraConflict(o,state))throw Error('该相机档期已有未完成订单，请调整日期或更换相机。');mutate(s=>{if(id)s.orders=s.orders.map(x=>x.id===id?o:x);else s.orders.push(o)})});const t=field(f,'业务类型','oType','select',prev?.type||type,[['rental','相机出租'],['shoot','陪拍服务']]);if(prev)t.disabled=true;field(f,'客户称呼 *','oCustomer','text',prev?.customer||'').maxLength=80;field(f,'联系方式（可选）','oContact','text',prev?.contact||'').maxLength=100;field(f,'开始日期 *','oStart','date',prev?.start||today());field(f,'结束 / 应归还日期 *','oEnd','date',prev?.end||today());field(f,'相机（出租必选，陪拍可选）','oCamera','select',prev?.cameraId||'',[['','不指定相机'],...state.cameras.map(c=>[c.id,c.name+(c.serial?' · '+c.serial:'')+(c.status!=='active'?'（不可接新单）':'')])]);field(f,'服务总金额 *（不含押金）','oPrice','text',prev?(prev.price/100).toFixed(2):'').inputMode='decimal';const dep=field(f,'应收押金（仅出租）','oDeposit','text',prev?(prev.depositTarget/100).toFixed(2):'0');dep.inputMode='decimal';t.onchange=()=>dep.disabled=t.value!=='rental';t.onchange();field(f,'备注（地点、时间、配件等）','oNote','textarea',prev?.note||'').maxLength=200;f.append(E('p','创建订单后，可分多次登记定金、尾款与押金。订单金额不含押金。','hint'));submitButton(f,'保存订单')})}
function transactionForm(orderId=null,kind='payment'){const o=state.orders.find(o=>o.id===orderId);open(names[kind],parent=>{if(o){const b=orderTotals(o);parent.append(E('p',`${orderLabel(o)} · 待收款 ¥${money(due(o))} · 在手押金 ¥${money(b.held)}`,'muted'))}const f=formBox(parent,()=>{const t={id:uid(),orderId,kind,cents:cents($('tAmount').value),date:$('tDate').value,category:kind==='expense'?$('tCategory').value:names[kind],note:$('tNote').value.trim(),voided:false};if(!validDate(t.date))throw Error('请填写有效日期。');if(o?.status==='cancelled')throw Error('已取消订单不能新增收退款。');mutate(s=>s.transactions.push(t))});const amount=field(f,'本次金额 *','tAmount','text','');amount.inputMode='decimal';if(o){const b=orderTotals(o);amount.placeholder='最多 '+money(({payment:due(o),refund:b.paid,deposit:o.depositTarget-b.held,depositRefund:b.held})[kind])}field(f,'实际收付日期 *','tDate','date',today());if(kind==='expense')field(f,'支出分类','tCategory','select',expenseCats[0],expenseCats.map(c=>[c,c]));field(f,'备注（定金、尾款、支付方式等）','tNote','textarea','').maxLength=200;if(['deposit','depositRefund'].includes(kind))f.append(E('p','押金独立核算，不计入营业收入与收支结余。','hint'));submitButton(f,'确认记录')})}
function cameraForm(id){const c=state.cameras.find(c=>c.id===id);open(c?'编辑相机':'添加相机',parent=>{const f=formBox(parent,()=>{const next={id:id||uid(),name:$('cName').value.trim(),serial:$('cSerial').value.trim(),status:$('cStatus').value};if(!next.name)throw Error('请填写相机名称。');mutate(s=>{if(id)s.cameras=s.cameras.map(x=>x.id===id?next:x);else s.cameras.push(next)})});field(f,'型号 / 名称 *','cName','text',c?.name||'').maxLength=80;field(f,'编号 / 序列号','cSerial','text',c?.serial||'').maxLength=80;field(f,'设备状态','cStatus','select',c?.status||'active',[['active','可接单'],['maintenance','维修中'],['retired','已停用']]);f.append(E('p','同型号相机请逐台添加。维修或停用后仍保留已有预约，请处理交付安排。设备购置款请另记经营支出。','hint'));submitButton(f,'保存相机')})}
function detail(id){const o=state.orders.find(o=>o.id===id),b=orderTotals(o);open('订单详情',parent=>{parent.append(orderCard(o));if(o.contact)parent.append(E('p','联系方式：'+o.contact,'muted'));const a=E('div',null,'actions');if(o.status!=='cancelled'){a.append(button('编辑订单',()=>orderForm(o.id),'small'));if(due(o)>0)a.append(button('收取定金 / 尾款',()=>transactionForm(id,'payment'),'primary small'));if(b.paid>0)a.append(button('服务退款',()=>transactionForm(id,'refund'),'small'));if(o.type==='rental'){if(b.held<o.depositTarget)a.append(button('收押金',()=>transactionForm(id,'deposit'),'small'));if(b.held>0)a.append(button('退押金',()=>transactionForm(id,'depositRefund'),'small'))}if(o.status==='booked')a.append(button(o.type==='rental'?'确认已取机':'开始服务',()=>changeStatus(id,'ongoing'),'small'));if(['booked','ongoing'].includes(o.status))a.append(button(o.type==='rental'?'确认相机已归还':'确认服务已完成',()=>changeStatus(id,'done'),'small'));if(o.status==='done')a.append(button('重新打开订单',()=>changeStatus(id,'booked'),'small'));a.append(button('取消订单',()=>changeStatus(id,'cancelled'),'warn small'))}parent.append(a,E('p','订单完成后未结清的款项仍在待办显示。取消前需退清已收服务款和押金；如果保留取消费用，请将服务金额调整为该费用并标记完成。','hint'));const list=block('此订单资金记录'),ts=state.transactions.filter(t=>t.orderId===id).slice().reverse();if(!ts.length)empty(list,'尚未登记收退款。');ts.forEach(t=>list.append(txCard(t)));parent.append(list)})}
function confirmBox(title,message,action){open(title,parent=>{parent.append(E('p',message,'muted'));const err=E('p','','error');err.setAttribute('role','alert');parent.append(err,button('确认',()=>{try{action();close();notify('已更新。')}catch(e){err.textContent=e.message}},'primary'))})}
function changeStatus(id,status){const o=state.orders.find(o=>o.id===id);confirmBox('更新订单状态',`${orderLabel(o)}：${status==='done'?(o.type==='rental'?'确认相机与配件已归还？':'确认服务已完成？'):status==='cancelled'?'确认取消？请先退清服务款及押金。':status==='ongoing'?'确认已开始服务 / 已交付相机？':'重新打开会重新占用相机档期，是否继续？'}`,()=>mutate(s=>{const target=s.orders.find(o=>o.id===id);target.status=status;if(cameraConflict(target,s))throw Error('该相机档期与现有订单冲突。')}))}
function voidTransaction(id){const t=state.transactions.find(t=>t.id===id);confirmBox('作废流水',`确认作废 ${names[t.kind]} ¥${money(t.cents)}？原记录会保留；如已有后续退款导致余额不符，请先作废后续记录。`,()=>mutate(s=>s.transactions.find(t=>t.id===id).voided=true))}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=E('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function backup(){if(!ready){download(JSON.stringify({businessRaw:localStorage.getItem(KEY),legacyRaw:localStorage.getItem(OLD)},null,2),'CCD-原始数据-'+today()+'.json','application/json');return}download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'CCD生意账-'+today()+'.json','application/json');try{localStorage.setItem(BK,new Date().toLocaleString('zh-CN'))}catch(e){}notify('已发起备份下载，请确认已存储到“文件”。')}
function csvCell(x){const v=String(x??'');return '"'+(/^[=+\-@\t\r]/.test(v)?"'":'')+v.replaceAll('"','""')+'"'}
function exportCSV(){const records=monthTx().map(t=>{const o=state.orders.find(o=>o.id===t.orderId);return [t.date,names[t.kind],o?orderLabel(o):'',t.category,(cash(t)/100).toFixed(2),t.note]});download('\uFEFF'+[['日期','类型','订单','分类','资金金额（元）','备注'],...records].map(a=>a.map(csvCell).join(',')).join('\r\n'),'CCD流水-'+$('month').value+'.csv','text/csv;charset=utf-8')}
function backupPanel(){open('数据与备份',parent=>{parent.append(E('p','账本只保存在此设备与此网址，不自动上传。清除网站数据、换手机或改网址前请先导出。建议每周备份，备份含客户联系方式。','hint'),button('导出完整 JSON 备份',backup,'primary'),E('p','导出后请确认文件已保存。','hint'),button('导入并合并备份',()=>$('restoreFile').click()));let date='';try{date=localStorage.getItem(BK)||'尚无备份记录'}catch(e){}parent.append(E('p','上次发起导出：'+date,'hint'),E('p','同编号且一致的记录会跳过；同编号内容不同则拒绝合并，避免覆盖。原日常账本流水已自动保留为“原账本收入 / 支出”。','hint'),E('h3','iPhone 使用'),E('p','Safari 打开固定网址 → 分享 → 添加到主屏幕。固定从主屏幕使用，不要使用无痕模式；首次联网打开后可尝试离线启动。','hint'))})}
function canonical(x){if(Array.isArray(x))return '['+x.map(canonical).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';return JSON.stringify(x)}
function merge(s,incoming){const next=JSON.parse(JSON.stringify(s));let count=0;for(const key of ['cameras','orders','transactions'])for(const x of incoming[key]){const found=next[key].find(y=>y.id===x.id);if(found){if(canonical(found)!==canonical(x))throw Error('同编号记录内容不同，已取消合并，当前账本未修改。')}else{next[key].push(x);count++}}validate(next);return {next,count}}
$('restoreFile').onchange=async()=>{const f=$('restoreFile').files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('备份不能超过 15 MB。');const data=validate(JSON.parse(await f.text())),result=merge(state,data);confirmBox('合并备份',`将合并 ${result.count} 条新记录，已有一致记录会跳过。`,()=>save(merge(state,data).next))}catch(e){notify(e instanceof SyntaxError?'文件不是有效 JSON 备份。':e.message)}finally{$('restoreFile').value=''}};
$('closeModal').onclick=close;$('backupTop').onclick=backupPanel;$('month').value=today().slice(0,7);$('month').onchange=()=>{if(!$('month').value)$('month').value=today().slice(0,7);render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));window.addEventListener('storage',e=>{if(e.key===KEY){try{state=validate(JSON.parse(e.newValue));ready=true;close();render();notify('已更新其他窗口的修改。')}catch(e){ready=false;render();notify('其他窗口数据异常，已暂停写入。')}}});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
